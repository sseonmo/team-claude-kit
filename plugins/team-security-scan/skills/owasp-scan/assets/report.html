<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>OWASP Top 10 스캔 리포트</title>
<style>
  :root {
    color-scheme: light;
    --plane: #f9f9f7;
    --surface: #fcfcfb;
    --ink: #0b0b0b;
    --ink-2: #52514e;
    --ink-muted: #898781;
    --hair: #e1e0d9;
    --border: rgba(11, 11, 11, 0.10);
    --critical: #d03b3b;
    --serious: #ec835a;
    --warning: #fab219;
    --low: #898781;
    --good: #0ca30c;
    --seq-0: #f0efec;
    --seq-1: #cde2fb;
    --seq-2: #9ec5f4;
    --seq-3: #5598e7;
    --seq-4: #2a78d6;
    --seq-5: #184f95;
    --seq-ink-light: #0b0b0b;
    --seq-ink-dark: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --plane: #0d0d0d;
      --surface: #1a1a19;
      --ink: #ffffff;
      --ink-2: #c3c2b7;
      --ink-muted: #898781;
      --hair: #2c2c2a;
      --border: rgba(255, 255, 255, 0.10);
      --seq-0: #383835;
      --seq-1: #184f95;
      --seq-2: #256abf;
      --seq-3: #3987e5;
      --seq-4: #6da7ec;
      --seq-5: #9ec5f4;
      --seq-ink-light: #ffffff;
      --seq-ink-dark: #0b0b0b;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --plane: #0d0d0d;
    --surface: #1a1a19;
    --ink: #ffffff;
    --ink-2: #c3c2b7;
    --ink-muted: #898781;
    --hair: #2c2c2a;
    --border: rgba(255, 255, 255, 0.10);
    --seq-0: #383835;
    --seq-1: #184f95;
    --seq-2: #256abf;
    --seq-3: #3987e5;
    --seq-4: #6da7ec;
    --seq-5: #9ec5f4;
    --seq-ink-light: #ffffff;
    --seq-ink-dark: #0b0b0b;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--plane);
    color: var(--ink);
    font: 15px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 40px 16px 80px; }

  header h1 { font-size: 26px; margin: 0 0 6px; letter-spacing: -0.01em; }
  header .meta { color: var(--ink-2); font-size: 13px; }
  header .meta code { color: var(--ink); }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
  }
  h2 { font-size: 15px; margin: 40px 0 12px; color: var(--ink-2); font-weight: 600; }

  /* KPI row */
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-top: 24px; }
  .kpi { padding: 16px 18px; }
  .kpi .label { font-size: 12px; color: var(--ink-2); display: flex; align-items: center; gap: 6px; }
  .kpi .value { font-size: 30px; font-weight: 600; margin-top: 4px; letter-spacing: -0.02em; }
  .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }

  /* Heatmap */
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(198px, 1fr)); gap: 8px; }
  .cat {
    padding: 13px 15px; border-radius: 10px; border: 1px solid var(--border);
    display: flex; flex-direction: column; gap: 3px; cursor: pointer;
    text-align: left; font: inherit; width: 100%;
  }
  .cat:hover { outline: 2px solid var(--seq-4); outline-offset: 1px; }
  .cat[aria-pressed="true"] { outline: 2px solid var(--ink); outline-offset: 1px; }
  .cat .code { font-size: 11px; font-weight: 700; letter-spacing: 0.06em; opacity: 0.75; }
  .cat .name { font-size: 13px; line-height: 1.35; }
  .cat .n { font-size: 22px; font-weight: 600; margin-top: 3px; font-variant-numeric: tabular-nums; }

  /* Filters */
  .filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 12px 0 14px; }
  .chip {
    font: inherit; font-size: 13px; padding: 5px 12px; border-radius: 999px;
    border: 1px solid var(--border); background: var(--surface); color: var(--ink-2); cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .chip[aria-pressed="true"] { background: var(--ink); color: var(--plane); border-color: var(--ink); }
  .chip[aria-pressed="true"] .dot { outline: 1px solid var(--plane); }
  .spacer { flex: 1; }
  .count { font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; }

  /* Findings */
  details.finding { border-bottom: 1px solid var(--hair); }
  details.finding:last-child { border-bottom: 0; }
  details.finding > summary {
    list-style: none; cursor: pointer; padding: 13px 16px;
    display: grid; grid-template-columns: 8px 62px 1fr auto; gap: 12px; align-items: baseline;
  }
  details.finding > summary::-webkit-details-marker { display: none; }
  summary:hover { background: color-mix(in srgb, var(--ink) 4%, transparent); }
  .sev-bar { width: 8px; height: 8px; border-radius: 2px; align-self: center; }
  .sev-label { font-size: 11px; font-weight: 700; letter-spacing: 0.04em; font-variant-numeric: tabular-nums; }
  .f-title { font-size: 14px; }
  .f-loc { font-size: 12px; color: var(--ink-muted); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .badge {
    font-size: 11px; padding: 2px 8px; border-radius: 999px;
    border: 1px solid var(--border); color: var(--ink-2); white-space: nowrap;
  }
  .badge.confirmed { border-color: var(--good); color: var(--good); }
  .body { padding: 4px 16px 20px 82px; }
  .body dl { display: grid; grid-template-columns: 92px 1fr; gap: 6px 16px; margin: 0 0 14px; }
  .body dt { font-size: 12px; color: var(--ink-2); }
  .body dd { margin: 0; font-size: 14px; }
  pre {
    margin: 0 0 14px; padding: 12px 14px; overflow-x: auto; border-radius: 8px;
    background: var(--plane); border: 1px solid var(--border);
    font: 12.5px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .empty { padding: 40px 16px; text-align: center; color: var(--ink-muted); font-size: 14px; }

  /* Tools */
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th { text-align: left; font-weight: 600; color: var(--ink-2); font-size: 12px; padding: 10px 16px; border-bottom: 1px solid var(--hair); }
  td { padding: 10px 16px; border-bottom: 1px solid var(--hair); }
  td.status { white-space: nowrap; }
  tr:last-child td { border-bottom: 0; }
  td.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; color: var(--ink-2); }
  .warnbox {
    margin-top: 12px; padding: 12px 16px; border-radius: 8px; font-size: 13.5px;
    border: 1px solid var(--warning); background: color-mix(in srgb, var(--warning) 10%, transparent);
  }
  footer { margin-top: 48px; color: var(--ink-muted); font-size: 12px; }
  .toggle { position: fixed; top: 16px; right: 16px; }
</style>
</head>
<body>
<button class="chip toggle" id="theme" type="button" aria-pressed="false">다크 모드</button>
<div class="wrap">

<header>
  <h1 id="h-title">OWASP Top 10 스캔 리포트</h1>
  <div class="meta" id="h-meta"></div>
</header>

<div class="kpis" id="kpis"></div>

<h2>항목별 분포 — 색이 진할수록 발견이 많음</h2>
<div class="grid" id="cats"></div>

<h2 id="h-findings">발견 목록</h2>
<div class="filters" id="filters"></div>
<div class="card" id="findings"></div>

<h2>스캔 도구 실행 현황</h2>
<div class="card"><table>
  <thead><tr><th>도구</th><th>버전</th><th>설정</th><th>상태</th><th>비고</th></tr></thead>
  <tbody id="tools"></tbody>
</table></div>
<div id="toolwarn"></div>

<footer id="foot"></footer>
</div>

<script id="scan-data" type="application/json">
{
  "repo": "(리포 이름)",
  "scannedAt": "",
  "scope": { "files": 0, "loc": 0, "excluded": [] },
  "tools": [],
  "findings": []
}
</script>

<script>
(() => {
  const CATS = {
    A01: "Broken Access Control",
    A02: "Security Misconfiguration",
    A03: "Software Supply Chain Failures",
    A04: "Cryptographic Failures",
    A05: "Injection",
    A06: "Insecure Design",
    A07: "Authentication Failures",
    A08: "Software or Data Integrity Failures",
    A09: "Security Logging and Alerting Failures",
    A10: "Mishandling of Exceptional Conditions",
  };
  const SEV = {
    critical: { label: "CRITICAL", icon: "◆", color: "var(--critical)", rank: 0 },
    high:     { label: "HIGH",     icon: "▲", color: "var(--serious)",  rank: 1 },
    medium:   { label: "MEDIUM",   icon: "●", color: "var(--warning)",  rank: 2 },
    low:      { label: "LOW",      icon: "▬", color: "var(--low)",      rank: 3 },
  };
  const SEQ = ["--seq-0", "--seq-1", "--seq-2", "--seq-3", "--seq-4", "--seq-5"];

  const data = JSON.parse(document.getElementById("scan-data").textContent);
  const findings = (data.findings || []).slice().sort((a, b) => {
    const d = SEV[a.severity].rank - SEV[b.severity].rank;
    return d || String(a.category).localeCompare(String(b.category));
  });
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const el = (html) => { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstElementChild; };

  // header
  const sc = data.scope || {};
  document.getElementById("h-title").textContent = `${data.repo} — OWASP Top 10:2025 스캔`;
  document.getElementById("h-meta").innerHTML =
    `${esc(data.scannedAt)} · 파일 ${sc.files ?? "?"}개 / ${sc.loc ?? "?"} 라인 스캔` +
    (sc.excluded && sc.excluded.length ? ` · 제외: <code>${esc(sc.excluded.join(", "))}</code>` : "");

  // KPIs
  const by = (s) => findings.filter((f) => f.severity === s).length;
  const confirmed = findings.filter((f) => f.verification === "CONFIRMED").length;
  document.getElementById("kpis").append(...[
    ["총 발견", findings.length, null],
    ["Critical", by("critical"), SEV.critical],
    ["High", by("high"), SEV.high],
    ["Medium", by("medium"), SEV.medium],
    ["Low", by("low"), SEV.low],
    ["검증 완료", `${confirmed}/${findings.filter((f) => f.verification).length}`, null],
  ].map(([label, value, sev]) => el(
    `<div class="card kpi">
       <div class="label">${sev ? `<span class="dot" style="background:${sev.color}"></span>` : ""}${esc(label)}</div>
       <div class="value">${esc(value)}</div>
     </div>`)));

  // category heatmap
  const counts = Object.fromEntries(Object.keys(CATS).map((c) => [c, findings.filter((f) => f.category === c).length]));
  const max = Math.max(1, ...Object.values(counts));
  const catsEl = document.getElementById("cats");
  const state = { cat: null, sev: null };

  Object.entries(CATS).forEach(([code, name]) => {
    const n = counts[code];
    const step = n === 0 ? 0 : Math.min(5, 1 + Math.floor((n / max) * 4.999));
    const b = el(
      `<button class="cat" type="button" aria-pressed="false" data-cat="${code}"
        style="background:var(${SEQ[step]});color:var(${step >= 4 ? "--seq-ink-dark" : "--seq-ink-light"})">
        <span class="code">${code}:2025</span>
        <span class="name">${esc(name)}</span>
        <span class="n">${n}</span>
      </button>`);
    b.addEventListener("click", () => { state.cat = state.cat === code ? null : code; render(); });
    catsEl.append(b);
  });

  // severity filters
  const filtersEl = document.getElementById("filters");
  Object.entries(SEV).forEach(([key, s]) => {
    const b = el(`<button class="chip" type="button" aria-pressed="false" data-sev="${key}">
      <span class="dot" style="background:${s.color}"></span>${s.icon} ${s.label}</button>`);
    b.addEventListener("click", () => { state.sev = state.sev === key ? null : key; render(); });
    filtersEl.append(b);
  });
  const reset = el(`<button class="chip" type="button">필터 해제</button>`);
  reset.addEventListener("click", () => { state.cat = null; state.sev = null; render(); });
  filtersEl.append(reset, el(`<span class="spacer"></span>`), el(`<span class="count" id="shown"></span>`));

  // findings
  const listEl = document.getElementById("findings");
  function render() {
    const shown = findings.filter((f) =>
      (!state.cat || f.category === state.cat) && (!state.sev || f.severity === state.sev));
    catsEl.querySelectorAll("[data-cat]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.cat === state.cat)));
    filtersEl.querySelectorAll("[data-sev]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.sev === state.sev)));
    document.getElementById("shown").textContent = `${shown.length} / ${findings.length} 건 표시`;

    listEl.replaceChildren();
    if (!shown.length) { listEl.append(el(`<div class="empty">해당하는 발견이 없습니다.</div>`)); return; }
    shown.forEach((f) => {
      const s = SEV[f.severity];
      listEl.append(el(
        `<details class="finding">
           <summary>
             <span class="sev-bar" style="background:${s.color}"></span>
             <span class="sev-label" style="color:${s.color}">${s.icon} ${s.label}</span>
             <span>
               <span class="f-title">${esc(f.title)}</span><br />
               <span class="f-loc">${esc(f.file)}${f.line ? ":" + f.line : ""}</span>
             </span>
             <span>
               <span class="badge">${esc(f.category)}</span>
               ${f.cwe ? `<span class="badge">${esc(f.cwe)}</span>` : ""}
               ${f.verification ? `<span class="badge ${f.verification === "CONFIRMED" ? "confirmed" : ""}">${esc(f.verification)}</span>` : ""}
             </span>
           </summary>
           <div class="body">
             ${f.snippet ? `<pre>${esc(f.snippet)}</pre>` : ""}
             <dl>
               <dt>악용 시나리오</dt><dd>${esc(f.scenario)}</dd>
               ${f.impact ? `<dt>영향</dt><dd>${esc(f.impact)}</dd>` : ""}
               <dt>수정 방향</dt><dd>${esc(f.fix)}</dd>
               <dt>탐지 출처</dt><dd>${esc(f.source || "-")}</dd>
             </dl>
           </div>
         </details>`));
    });
  }
  render();

  // tools
  const tools = data.tools || [];
  document.getElementById("tools").append(...tools.map((t) => el(
    `<tr>
       <td>${esc(t.name)}</td>
       <td class="mono">${esc(t.version || "-")}</td>
       <td class="mono">${esc(t.config || "-")}</td>
       <td class="status" style="color:${t.status === "ran" ? "var(--good)" : "var(--warning)"}">
         ${t.status === "ran" ? "● 실행됨" : "▲ 미실행"}</td>
       <td>${esc(t.status === "ran" ? `발견 ${t.findings ?? 0}건` : t.reason || "")}</td>
     </tr>`)));
  const skipped = tools.filter((t) => t.status !== "ran");
  if (skipped.length) {
    document.getElementById("toolwarn").append(el(
      `<div class="warnbox">▲ 미실행 도구 ${skipped.length}종(${esc(skipped.map((t) => t.name).join(", "))})이 있습니다.
       해당 영역은 코드 정독만으로 판단했으므로 <strong>누락이 있을 수 있습니다</strong>.</div>`));
  }

  document.getElementById("foot").textContent =
    `OWASP Top 10:2025 기준 · /owasp-scan 으로 생성 · 이 리포트는 자동 스캔 결과이며 수동 검증을 대체하지 않습니다.`;

  // theme toggle
  const tg = document.getElementById("theme");
  tg.addEventListener("click", () => {
    const dark = document.documentElement.getAttribute("data-theme") === "dark";
    document.documentElement.setAttribute("data-theme", dark ? "light" : "dark");
    tg.setAttribute("aria-pressed", String(!dark));
    tg.textContent = dark ? "다크 모드" : "라이트 모드";
  });
})();
</script>
</body>
</html>
